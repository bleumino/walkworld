
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Explore the world from home with curated virtual walking tours from cities around the globe.">

  <title>WalkWorld — Explore the World</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- NAVIGATION -->
  <nav id="mainNav">
    <a href="#home" class="logo">Walk<span>World</span></a>

        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
          🌙
        </button>
  </nav>

  <!-- BACK TO TOP -->
  <button
    id="backToTop"
    class="back-to-top"
    onclick="scrollToTop()">
    Scroll to top ↑
  </button>


  <!-- MAIN EXPLORER -->
  <main class="explorer-layout" id="home">

    <!-- LEFT SIDEBAR -->
    <aside class="tour-sidebar" id="toursSection">

      <!-- SEARCH -->
      <div class="sidebar-search">
        <input
          class="search-input"
          type="text"
          placeholder="Search cities or tours..."
          id="searchInput"
          oninput="filterTours()"
          aria-label="Search walking tours">
      </div>

      <!-- RANDOM TOUR -->
      <button
        class="random-btn"
        onclick="openRandomTour()">
        <span class="random-dice">🎲</span>
        Surprise me
      </button>

      <!-- REGION FILTERS -->
      <div class="sidebar-filters">

        <p class="filter-label">Explore by region</p>

        <div class="filter-buttons">

          <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
          <button class="filter-btn" onclick="setFilter('asia', this)">Asia</button>
          <button class="filter-btn" onclick="setFilter('europe', this)">Europe</button>
          <button class="filter-btn" onclick="setFilter('americas', this)">Americas</button>
          <button class="filter-btn" onclick="setFilter('middleeast', this)">Middle East</button>
          <button class="filter-btn" onclick="setFilter('africa', this)">Africa</button>
          <button class="filter-btn" onclick="setFilter('oceania', this)">Oceania</button>
          <button class="filter-btn" onclick="setFilter('trending', this)">🔥 Trending</button>

        </div>
      </div>

      <!-- VIDEO LIST -->
      <div class="sidebar-tour-heading">
        <h2>Walking tours</h2>
        <span class="section-count" id="tourCount"></span>
      </div>

      <!-- TOUR CARDS GENERATED BY app.js -->
      <div class="grid" id="grid"></div>

      </div>

    </aside>


    <!-- RIGHT SIDE: MAP -->
    <section class="world-section" id="world-map">
      <!-- INTERACTIVE MAP -->
      <div class="map-canvas">

        <div
          id="worldMap"
          role="application"
          aria-label="Interactive world map">
        </div>

        <div
          class="map-tooltip"
          id="mapTooltip"
          role="status">
        </div>

      </div>

      <!-- SELECTED COUNTRY PANEL -->
      <div
        class="map-country-panel"
        id="countryPanel"
        aria-live="polite">

        <p class="panel-placeholder">
          Select a country on the map to discover available walking tours.
        </p>

      </div>

    </section>

  </main>


  <!-- RANDOM TOUR MODAL -->
  <div
    class="random-backdrop"
    id="randomBackdrop"
    onclick="handleRandomBackdropClick(event)">

    <div class="random-modal" id="randomModal">

      <button
        class="btn-close random-close"
        onclick="closeRandom()"
        aria-label="Close random tour">
        ✕
      </button>

      <div class="random-spinning" id="randomSpinner">

        <div class="random-globe" id="randomGlobe">🌍</div>

        <p class="random-label" id="randomLabel">
          Spinning the globe…
        </p>

      </div>

      <div class="random-result" id="randomResult">

        <p class="random-result-eyebrow">Your random tour</p>

        <p class="random-result-city" id="randomResultCity"></p>
        <p class="random-result-title" id="randomResultTitle"></p>
        <p class="random-result-meta" id="randomResultMeta"></p>

        <div class="random-result-actions">

          <button class="watch-pill" id="randomWatchBtn">
            <span class="play-tri"></span>
            Watch now
          </button>

          <button class="random-again-btn" onclick="spinAgain()">
            🎲 Another one
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- VIDEO MODAL -->
  <div
    class="modal-backdrop"
    id="modal"
    onclick="handleBackdropClick(event)">

    <div class="modal" id="modalBox">

      <div class="modal-video" id="modalVideo"></div>

      <div class="modal-info">

        <div class="modal-meta">

          <p class="modal-city" id="modalCity"></p>
          <p class="modal-title" id="modalTitle"></p>
          <p class="modal-views" id="modalViews"></p>

        </div>

        <div class="modal-actions">

          <a
            class="btn-yt"
            id="modalYTLink"
            href="#"
            target="_blank"
            rel="noopener">
            Open in YouTube ↗
          </a>

          <button
            class="btn-close"
            onclick="closeModal()"
            aria-label="Close video">
            ✕
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- EXTERNAL LIBRARIES -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- PROJECT JAVASCRIPT -->
  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
