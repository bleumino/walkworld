<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Explore the world from home with curated virtual walking tours from cities around the globe.">

  <title>WalkWorld — Explore the World</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="styles.css">
  <!-- Full-window map layout. Remove this line to go back to the old layout. -->
  <link rel="stylesheet" href="immersive.css">
</head>

<body>

  <!-- NAVIGATION -->
  <nav id="mainNav">
    <a href="#home" class="logo">Walk<span>World</span></a>

    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
      🌙
    </button>
  </nav>


  <!-- MAIN EXPLORER -->
  <main class="explorer-layout" id="home">

    <!-- LEFT SIDEBAR -->
    <aside class="tour-sidebar" id="toursSection">

      <!-- SEARCH + RANDOM TOUR -->
      <div class="sidebar-top">

        <div class="sidebar-search">
          <input
            class="search-input"
            type="text"
            placeholder="Search cities or tours..."
            id="searchInput"
            oninput="filterTours()"
            aria-label="Search walking tours">
        </div>

        <button
          class="random-btn"
          onclick="openRandomTour()">
          <span class="random-dice">🎲</span>
          Surprise me
        </button>

      </div>

      <!-- REGION FILTERS -->
      <div class="sidebar-filters">

        <p class="filter-label">Explore by region</p>

        <div class="filter-buttons">

          <button class="filter-btn active" data-region="all" onclick="setFilter('all', this)">All</button>
          <button class="filter-btn" data-region="asia" onclick="setFilter('asia', this)">Asia</button>
          <button class="filter-btn" data-region="europe" onclick="setFilter('europe', this)">Europe</button>
          <button class="filter-btn" data-region="americas" onclick="setFilter('americas', this)">Americas</button>
          <button class="filter-btn" data-region="middleeast" onclick="setFilter('middleeast', this)">Middle East</button>
          <button class="filter-btn" data-region="africa" onclick="setFilter('africa', this)">Africa</button>
          <button class="filter-btn" data-region="oceania" onclick="setFilter('oceania', this)">Oceania</button>
          <button class="filter-btn" data-region="trending" onclick="setFilter('trending', this)">🔥 Trending</button>

        </div>
      </div>

      <!-- VIDEO LIST -->
      <div class="sidebar-tour-heading">
        <h2>Walking tours</h2>
        <span class="section-count" id="tourCount"></span>
      </div>

      <!-- TOUR CARDS GENERATED BY app.js -->
      <div class="grid" id="grid"></div>

    </aside>


    <!-- RIGHT SIDE: MAP -->
    <section class="world-section" id="world-map">

      <div class="map-canvas">

        <div
          id="worldMap"
          role="application"
          aria-label="Interactive world map">
        </div>

        <button class="map-home" id="resetMap" type="button">
          🌍 World view
        </button>

        <div class="map-chip" role="status">
          <strong id="mapVisibleCount">0</strong> walks on the map
          <span class="map-chip-visited" id="mapVisited"></span>
        </div>

      </div>

    </section>

  </main>


  <!-- RANDOM TOUR MODAL -->
  <div
    class="random-backdrop"
    id="randomBackdrop"
    onclick="handleRandomBackdropClick(event)">

    <div class="random-modal" id="randomModal">

      <button
        class="btn-close random-close"
        onclick="closeRandom()"
        aria-label="Close random tour">
        ✕
      </button>

      <div class="random-spinning" id="randomSpinner">

        <div class="random-globe" id="randomGlobe">🌍</div>

        <p class="random-label" id="randomLabel">
          Spinning the globe…
        </p>

      </div>

      <div class="random-result" id="randomResult">

        <p class="random-result-eyebrow">Your random tour</p>

        <p class="random-result-city" id="randomResultCity"></p>
        <p class="random-result-title" id="randomResultTitle"></p>
        <p class="random-result-meta" id="randomResultMeta"></p>

        <div class="random-result-actions">

          <button class="watch-pill" id="randomWatchBtn">
            <span class="play-tri"></span>
            Watch now
          </button>

          <button class="random-again-btn" onclick="spinAgain()">
            🎲 Another one
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- VIDEO MODAL -->
  <div
    class="modal-backdrop"
    id="modal"
    onclick="handleBackdropClick(event)">

    <div class="modal" id="modalBox">

      <div class="modal-video" id="modalVideo"></div>

      <div class="modal-info">

        <div class="modal-meta">

          <p class="modal-city" id="modalCity"></p>
          <p class="modal-title" id="modalTitle"></p>
          <p class="modal-views" id="modalViews"></p>
          <p class="modal-now" id="modalNow" aria-live="polite"></p>

        </div>

        <div class="modal-actions">

          <button class="btn-next" id="modalNextBtn" type="button" onclick="nextStop()">
            Next stop
          </button>

          <a
            class="btn-yt"
            id="modalYTLink"
            href="#"
            target="_blank"
            rel="noopener">
            Open in YouTube ↗
          </a>

          <button
            class="btn-close"
            onclick="closeModal()"
            aria-label="Close video">
            ✕
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- EXTERNAL LIBRARIES -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- PROJECT JAVASCRIPT -->
  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
